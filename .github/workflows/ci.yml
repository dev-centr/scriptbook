name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install diagram dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated diagrams
        run: pnpm test

  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: scriptbook

      - uses: actions/checkout@v4
        with:
          repository: dev-centr/libequivalence
          path: libequivalence

      - name: Install LDC (Linux)
        if: runner.os == 'Linux'
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Install LDC (Windows)
        if: runner.os == 'Windows'
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Build library
        working-directory: scriptbook/lib
        run: dub build --compiler=ldc2

      - name: Test library
        working-directory: scriptbook/lib
        run: dub test --compiler=ldc2

      - name: Build CLI
        working-directory: scriptbook/cli
        run: dub build --compiler=ldc2

      - name: Smoke run (Unix)
        if: runner.os != 'Windows'
        working-directory: scriptbook
        run: |
          ./cli/bin/scriptbook version
          ./cli/bin/scriptbook run examples/smoke.cmk
          ./cli/bin/scriptbook status examples/smoke.cmk
          test -f examples/smoke.cmk.runs/index.json
          ./cli/bin/scriptbook clean-runs examples/smoke.cmk
          ./cli/bin/scriptbook run examples/install-gh.cmk --dry-run --yes --catalog examples/fixture-catalog.sdl

      - name: Smoke run (Windows)
        if: runner.os == 'Windows'
        working-directory: scriptbook
        shell: pwsh
        run: |
          .\cli\bin\scriptbook.exe version
          .\cli\bin\scriptbook.exe run examples\smoke.cmk
          .\cli\bin\scriptbook.exe status examples\smoke.cmk
          if (-not (Test-Path examples\smoke.cmk.runs\index.json)) { throw "missing sidecar" }
          .\cli\bin\scriptbook.exe clean-runs examples\smoke.cmk
          .\cli\bin\scriptbook.exe run examples\install-gh.cmk --dry-run --yes --catalog examples\fixture-catalog.sdl
