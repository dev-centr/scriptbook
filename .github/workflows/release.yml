name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: scriptbook-linux-x86_64
          - os: windows-latest
            artifact: scriptbook-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Build CLI
        working-directory: cli
        run: dub build --compiler=ldc2 -b release

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp cli/bin/scriptbook "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item cli\bin\scriptbook.exe "dist\${{ matrix.artifact }}.exe"
          Compress-Archive -Path "dist\${{ matrix.artifact }}.exe" -DestinationPath "dist\${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p upload
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} upload/ \;
          gh release create "$TAG" upload/* \
            --title "$TAG" \
            --notes "Scriptbook $TAG — library + CLI. See changelog.adoc." \
            --verify-tag || gh release upload "$TAG" upload/* --clobber
