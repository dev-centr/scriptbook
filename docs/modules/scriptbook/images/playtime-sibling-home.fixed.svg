<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">PlayTime lives in Dev-Centr while it is built; it rhymes with OpenShellOrg</title>
  <desc id="desc">Two buildings. PlayTime is in the Dev-Centr workshop. A dotted maybe-later path points at OpenShellOrg shell-boundary work. Do not move it yet.</desc>
  <defs>
    <style>
      .bg { fill: #f3f1ec; }
      .t { font-family: Georgia, "Times New Roman", serif; fill: #1a1a1a; }
      .s { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; font-size: 13px; }
      .label { font-family: "Segoe UI", system-ui, sans-serif; fill: #5a5a5a; font-size: 12px; letter-spacing: 0.04em; }
      .dc { fill: #e8f0ea; stroke: #1f3a2e; stroke-width: 2; }
      .oso { fill: #fff; stroke: #2c2c2c; stroke-width: 2; }
      .dash { stroke: #6b5a3e; stroke-width: 1.75; fill: none; stroke-dasharray: 7 5; marker-end: url(#m); }
      .roof { fill: #1f3a2e; }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b5a3e"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="400"/>
  <text class="label" x="32" y="36">ALIGNED, NOT MOVED</text>
  <text class="t" x="32" y="68" font-size="22">PlayTime rhymes with shells. It stays in the workshop.</text>

  <polygon class="roof" points="80,120 320,120 200,70"/>
  <rect class="dc" x="80" y="120" width="240" height="180"/>
  <text class="t" x="100" y="156" font-size="16">Dev-Centr</text>
  <text class="s" x="100" y="184">practitioner orchestration</text>
  <text class="s" x="100" y="204">Scriptbook app</text>
  <rect x="100" y="224" width="200" height="52" fill="#1f3a2e"/>
  <text x="112" y="254" font-family="Georgia, serif" font-size="16" fill="#f7f3e8">PlayTime (building)</text>

  <path class="dash" d="M330,210 H560"/>
  <text class="s" x="360" y="198">maybe later -- not now</text>

  <polygon class="roof" points="580,120 840,120 710,70"/>
  <rect class="oso" x="580" y="120" width="260" height="180"/>
  <text class="t" x="600" y="156" font-size="16">OpenShellOrg</text>
  <text class="s" x="600" y="184">shell boundary</text>
  <text class="s" x="600" y="204">argv honesty, SOS,</text>
  <text class="s" x="600" y="224">entrypoint dispatch</text>
  <text class="s" x="600" y="260">cousin concerns:</text>
  <text class="s" x="600" y="280">Host Awareness, argv not shell</text>

  <text class="s" x="32" y="350">A document runner that spawns argv without a shell is a shell-boundary idea.</text>
  <text class="s" x="32" y="370">The engine is being built in scriptbook. Do not relocate the kitchen mid-service.</text>
</svg>
